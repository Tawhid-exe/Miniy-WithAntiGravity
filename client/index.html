<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Default SEO (overridden per-page by React Helmet) -->
  <title>Minivy — Cute Aesthetic Bags & Accessories in Bangladesh</title>
  <meta name="description" content="Shop imported Korean aesthetic bags, accessories & lifestyle products in Bangladesh. Cash on delivery. Free shipping over ৳2,000. Curated collection from Minivy." />
  <meta name="keywords" content="aesthetic bags Bangladesh, Korean style accessories BD, cute mini bags, imported bags Bangladesh, Minivy, cash on delivery BD" />
  <link rel="canonical" href="https://minivy.vercel.app/" />

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Minivy" />
  <meta property="og:title" content="Minivy — Cute Aesthetic Bags & Accessories in Bangladesh" />
  <meta property="og:description" content="Imported Korean aesthetic products delivered across Bangladesh. Cash on delivery available." />
  <meta property="og:image" content="https://minivy.vercel.app/logo.jpeg" />
  <meta property="og:url" content="https://minivy.vercel.app/" />

  <!-- JSON-LD Structured Data for Google -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Store",
    "name": "Minivy",
    "description": "Imported Korean aesthetic bags, accessories & lifestyle products in Bangladesh.",
    "url": "https://minivy.vercel.app",
    "image": "https://minivy.vercel.app/logo.jpeg",
    "address": { "@type": "PostalAddress", "addressCountry": "BD" },
    "priceRange": "৳",
    "paymentAccepted": "Cash on Delivery"
  }
  </script>
</head>

<body>
  <div id="root">
    <style>
      .loader-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f8fafc;
        /* gray-50 */
      }

      .dark .loader-container {
        background-color: #030712;
        /* gray-950 */
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(147, 51, 234, 0.1);
        /* purple-600/10 */
        border-radius: 50%;
        border-top-color: #9333ea;
        /* purple-600 */
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }
    </style>
    <div class="loader-container">
      <div class="spinner"></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    // Simple dark mode check for loader background
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</body>

</html>
